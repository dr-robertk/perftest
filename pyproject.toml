[project]
name = "perftest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukas Elmlund", email = "lukas.elmlund@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3"
]

[project.scripts]
perftest = "perftest:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
]
