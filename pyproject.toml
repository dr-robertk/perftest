[project]
name = "perftest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukas Elmlund", email = "lukas.elmlund@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "psycopg2-binary>=2.9.9",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1,<9.2.0",  # pytest-benchmark 5.3.0 breaks on pytest 9.2.0 (relies on private node._nodeid)
    "pytest-benchmark>=5.3.0",
    "pandas>=2.3.0",
]
