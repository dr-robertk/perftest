# This workflow installs Python dependencies and runs the benchmark suite
# 3 times in parallel on Python 3.14 - Python version was checked and found
# to have no measurable effect on timing, so this just maximizes independent
# hardware-sample throughput per trigger rather than testing compatibility.

name: Testing

on:
  # Run on every push to main
  push:
    branches: ["main"]

  # Run every hour
  schedule:
    - cron: '0 * * * *'
  # Run when a PR targets main
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 "pytest>=9.1.1,<9.2.0" pytest-benchmark
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run performance benchmarks
        run: |
          pytest \
            --benchmark-only \
            --benchmark-json=benchmark-${{ matrix.replica }}.json

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-replica-${{ matrix.replica }}
          path: benchmark-${{ matrix.replica }}.json

      - name: Ingest benchmark results into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CI_MATRIX_LABEL: replica-${{ matrix.replica }}
        run: |
          python ingest_benchmarks.py benchmark-${{ matrix.replica }}.json