# This workflow will install Python dependencies, run tests and lint
# with a variety of Python versions.

name: Testing

on:
  # Run on every push to main
  push:
    branches: ["main"]

  # Run every 4 hours
  schedule:
    - cron: '0 */4 * * *'
  # Run when a PR targets main
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest pytest-benchmark
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run performance benchmarks
        run: |
          pytest \
            --benchmark-only \
            --benchmark-json=benchmark-${{ matrix.python-version }}.json

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-python-${{ matrix.python-version }}
          path: benchmark-${{ matrix.python-version }}.json